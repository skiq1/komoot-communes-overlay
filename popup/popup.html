<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zalicz Gminy — planery tras</title>

  <style>
    :root {
      --brand: #49a942;
      --brand-dark: #348b32;
      --brand-soft: #edf7eb;

      --blue: #3478f6;
      --blue-soft: #eef5ff;

      --danger: #d64545;
      --danger-soft: #fff0f0;

      --text: #20252a;
      --text-muted: #626b73;

      --border: #e5e9ec;
      --surface: #ffffff;
      --surface-soft: #f7f8f8;

      --radius: 9px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 340px;
      min-height: 180px;
      margin: 0;
      overflow-x: hidden;
      background: #f1f3f3;
      color: var(--text);
      font-family:
        Inter,
        "Segoe UI",
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;
      font-size: 13px;
      line-height: 1.4;
    }

    button,
    input {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .container {
      padding: 16px;
      background: var(--surface);
    }

    /* ---------- Header ---------- */

    .header {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 11px;
    }

    .logo {
      width: 34px;
      height: 34px;
      flex: 0 0 auto;
      object-fit: contain;
    }

    .header-copy {
      min-width: 0;
      flex: 1;
    }

    .header-title {
      font-size: 14px;
      line-height: 1.2;
      font-weight: 700;
      color: var(--text);
    }

    .header-subtitle {
      margin-top: 2px;
      font-size: 11px;
      color: var(--text-muted);
    }

    /* ---------- Top status / stats ---------- */

    .summary {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      padding: 10px 11px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface-soft);
    }

    .stats {
      min-width: 0;
    }

    .stats-number {
      font-size: 23px;
      line-height: 1;
      font-weight: 750;
      letter-spacing: -0.5px;
      color: var(--brand-dark);
    }

    .stats-label {
      margin-top: 3px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .map-status {
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
    }

    .map-status-dot {
      width: 8px;
      height: 8px;
      flex: 0 0 auto;
      border-radius: 50%;
      background: #c3c8cd;
      box-shadow: 0 0 0 3px rgba(195, 200, 205, 0.15);
    }

    .map-status-dot.connected {
      background: var(--brand);
      box-shadow: 0 0 0 3px rgba(73, 169, 66, 0.12);
    }

    .map-status-dot.disconnected {
      background: #e05252;
      box-shadow: 0 0 0 3px rgba(224, 82, 82, 0.12);
    }

    /* ---------- Sections ---------- */

    .section {
      padding: 14px 0;
      border-top: 1px solid var(--border);
    }

    .section + .section,
    .section + .btn-main,
    .btn-main + .section {
      margin-top: 8px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 7px;
    }

    .section-title {
      font-size: 13px;
      font-weight: 700;
      color: #555e65;
    }

    .selected-user {
      margin-bottom: 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--brand-dark);
      overflow-wrap: anywhere;
    }

    .settings-hint {
      margin-top: 6px;
      font-size: 12px;
      line-height: 1.35;
      color: var(--text-muted);
    }

    .settings-hint strong {
      color: #535a60;
    }

    /* ---------- Inputs ---------- */

    .settings-row {
      display: flex;
      align-items: stretch;
      gap: 6px;
    }

    .settings-row input {
      width: 100%;
      min-width: 0;
      height: 34px;
      padding: 0 9px;
      outline: none;
      border: 1px solid #dce1e4;
      border-radius: 7px;
      background: white;
      color: var(--text);
      font-size: 12px;
      transition:
        border-color 0.15s ease,
        box-shadow 0.15s ease;
    }

    .settings-row input::placeholder {
      color: #adb3b8;
    }

    .settings-row input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(73, 169, 66, 0.1);
    }

    .file-name {
      display: flex;
      align-items: center;
      min-width: 0;
      flex: 1;
      height: 34px;
      padding: 0 9px;
      overflow: hidden;
      border: 1px solid #dce1e4;
      border-radius: 7px;
      background: var(--surface-soft);
      color: #626a70;
      font-size: 11px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* ---------- Buttons ---------- */

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      min-height: 34px;
      padding: 0 11px;
      border: 1px solid transparent;
      border-radius: 7px;
      cursor: pointer;
      white-space: nowrap;
      font-size: 11.5px;
      font-weight: 650;
      transition:
        background 0.15s ease,
        border-color 0.15s ease,
        transform 0.1s ease,
        box-shadow 0.15s ease;
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn-primary {
      border-color: var(--brand);
      background: var(--brand);
      color: white;
    }

    .btn-primary:hover {
      border-color: var(--brand-dark);
      background: var(--brand-dark);
      box-shadow: 0 2px 7px rgba(52, 139, 50, 0.18);
    }

    .btn-secondary {
      border-color: #dce1e4;
      background: white;
      color: #535b61;
    }

    .btn-secondary:hover {
      background: var(--surface-soft);
      border-color: #ccd2d6;
    }

    .btn-danger {
      border-color: #f1d7d7;
      background: var(--danger-soft);
      color: var(--danger);
    }

    .btn-danger:hover {
      border-color: #ecc4c4;
      background: #ffe7e7;
    }

    .btn-main {
      width: 100%;
      min-height: 38px;
      font-size: 12px;
    }

    /* ---------- GPX ---------- */

    .gpx-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      margin-top: 6px;
    }

    .gpx-actions .btn {
      width: 100%;
    }

    .gpx-list {
      display: grid;
      gap: 5px;
      margin-top: 7px;
    }

    .gpx-list:empty {
      display: none;
    }

    .gpx-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 6px;
      min-height: 32px;
      padding: 4px 5px 4px 8px;
      border: 1px solid var(--border);
      border-radius: 7px;
      background: var(--surface-soft);
      color: #50575d;
      font-size: 11px;
    }

    .gpx-item-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .gpx-item-remove {
      min-height: 24px;
      padding: 0 7px;
      border-radius: 5px;
      font-size: 10px;
    }

    /* ---------- Messages ---------- */

    .status {
      margin-bottom: 8px;
      padding: 7px 9px;
      border: 1px solid transparent;
      border-radius: 7px;
      text-align: left;
      font-size: 11px;
      line-height: 1.35;
    }

    .status.success {
      border-color: #cfe8cb;
      background: var(--brand-soft);
      color: #286f2d;
    }

    .status.error {
      border-color: #f1cccc;
      background: #fff0f0;
      color: #9e3232;
    }

    .status.info {
      border-color: #d5e4fb;
      background: var(--blue-soft);
      color: #245b9d;
    }

    .map-connection {
      display: grid;
      gap: 3px;
    }

    .planner-links {
      display: flex;
      align-items: center;
      gap: 6px;
      padding-left: 14px;
      font-size: 11px;
    }

    .planner-links[hidden] {
      display: none;
    }

    .planner-links a {
      color: var(--brand-dark);
      text-underline-offset: 3px;
    }

    .gpx-section > summary {
      cursor: pointer;
    }

    .gpx-section[open] > summary {
      margin-bottom: 10px;
    }

    button:focus-visible,
    a:focus-visible,
    summary:focus-visible {
      outline: 2px solid var(--brand-dark);
      outline-offset: 3px;
    }
  </style>
</head>

<body>
  <div class="container">

    <header class="header">
      <img
        class="logo"
        src="../assets/zaliczgmine-badge.png"
        alt="Zalicz Gmine"
      >

      <div class="header-copy">
        <div class="header-title">ZaliczGmine.pl</div>
        <div class="header-subtitle">Nakładka mapy dla Komoot i VeloPlanner</div>
      </div>
    </header>

    <div id="status" role="status" aria-live="polite" class="status" style="display: none;"></div>

    <div class="summary">
      <div class="stats">
        <div class="stats-number" id="communesCount">-</div>
        <div class="stats-label">Zaliczonych gmin</div>
      </div>

      <div class="map-connection">
        <div class="map-status">
          <div class="map-status-dot" id="mapStatusDot"></div>
          <span id="mapStatusText">Sprawdzanie...</span>
        </div>
    <nav id="plannerLinks" class="planner-links" hidden aria-label="Obsługiwane planery tras">
      <a href="https://www.komoot.com/plan" target="_blank" rel="noopener noreferrer">Komoot</a>
      <span aria-hidden="true">·</span>
      <a href="https://veloplanner.com/pl/plan" target="_blank" rel="noopener noreferrer">VeloPlanner</a>
    </nav>
      </div>
    </div>

    <div class="section">
      <div class="section-header">
        <div class="section-title">Konto ZaliczGmine.pl</div>
      </div>
      <div id="selectedUser" class="selected-user" aria-live="polite">Nie wybrano konta</div>

      <div class="settings-row">
        <input
          id="userIdInput"
          type="text"
          placeholder="Nick lub ID użytkownika"
          aria-describedby="userSearchHint"
          aria-label="Nick lub ID użytkownika"
        >
        <button
          class="btn btn-primary"
          id="saveUserIdBtn"
        >
          Szukaj
        </button>
      </div>

      <div id="userSearchResults" class="gpx-list" aria-live="polite"></div>

      <div class="settings-hint" id="userSearchHint">
        Wyszukaj i wybierz swoje konto z listy.
      </div>
    </div>

    <button
      class="btn btn-secondary btn-main"
      id="toggleBtn"
    >
      Widoczność gmin
    </button>

    <details class="section gpx-section">
      <summary class="section-title">Trasy GPX</summary>

      <input
        id="gpxFileInput"
        type="file"
        accept=".gpx,application/gpx+xml,application/xml,text/xml"
        hidden
      >

      <div class="settings-row">
        <div
          class="file-name"
          id="gpxFileName"
        >
          Nie wybrano pliku
        </div>

        <button
          class="btn btn-secondary"
          id="chooseGpxBtn"
        >
          Wybierz
        </button>
      </div>

      <div class="gpx-actions">
        <button
          class="btn btn-primary"
          id="importGpxBtn"
        >
          Dodaj trasę
        </button>

        <button
          class="btn btn-danger"
          id="removeAllGpxBtn"
        >
          Usuń wszystkie
        </button>
      </div>

      <div
        class="gpx-list"
        id="gpxList"
      ></div>

      <div
        class="settings-hint"
        id="gpxStatusText"
      >
        Zaimportowane trasy pojawią się na mapie jako niebieskie linie.
      </div>
    </details>



  </div>

  <script src="../message-protocol.js"></script>
  <script src="../modules/zaliczgmine-api.js"></script>
  <script src="popup.js"></script>
</body>
</html>
